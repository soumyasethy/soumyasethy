  <g>
    <rect x="436" y="899" width="172" height="44" rx="8" class="c-gray-fill c-gray-stroke" stroke-width="1.15"/>
    <text class="th c-gray-th" x="522" y="919" text-anchor="middle">Bank reconciliation</text>
    <text class="ts c-gray-ts" x="522" y="935" text-anchor="middle">Statement matching</text>
  </g>
  <g>
    <rect x="632" y="899" width="172" height="44" rx="8" class="c-gray-fill c-gray-stroke" stroke-width="1.15"/>
    <text class="th c-gray-th" x="718" y="919" text-anchor="middle">Reporting</text>
    <text class="ts c-gray-ts" x="718" y="935" text-anchor="middle">P&amp;L, BS, cash flow</text>
